<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7d2315">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طفايات الحريق">
<title>نظام تقارير طفايات الحريق</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1f1d1a;--mute:#6b665e;--line:#ddd8cd;--acc:#a8321f;--acc2:#7d2315;--ok:#1d7a46;--warn:#b86e00;--bad:#b3261e;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;font-size:14px;line-height:1.5}
header.top{background:var(--acc2);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700}
header.top small{opacity:.8}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{border:0;background:none;padding:12px 16px;font:inherit;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
main{padding:18px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.stat:hover{border-color:var(--acc)}
.stat b{display:block;font-size:26px;color:var(--acc)}
.stat span{color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
button.b,select,input.i{font:inherit}
button.b{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:8px;cursor:pointer}
button.b:hover{border-color:var(--acc);color:var(--acc)}
button.b.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.b.p:hover{background:var(--acc2);color:#fff}
button.b.d:hover{border-color:var(--bad);color:var(--bad)}
select,input.i{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.f input{font-size:14px;color:var(--ink)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:#efece4;border-radius:20px;padding:3px 12px;font-size:12.5px}
.chip.g{background:#dff1e6;color:var(--ok)}.chip.m{background:#fbeccf;color:var(--warn)}.chip.x{background:#f8dcd9;color:var(--bad)}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.e{border-collapse:collapse;width:100%;min-width:900px}
table.e th{position:sticky;top:0;background:#efece4;font-size:12.5px;padding:7px 5px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
table.e td{border-bottom:1px solid #eee9de;padding:0}
table.e td input[type=text]{width:100%;border:0;padding:6px 6px;font:inherit;background:transparent;min-width:56px}
table.e td input[type=text]:focus{outline:2px solid var(--acc);background:#fffdf5}
table.e td.c{text-align:center}
table.e td.act{white-space:nowrap;width:58px;text-align:center}
table.e td.act button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:15px;padding:4px 5px}
table.e td.act button:hover{color:var(--bad)}
table.e tr:hover td{background:#fbf9f3}
.ltr{direction:ltr}
.ltr th,.ltr td input{text-align:left}
.bd{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.bd.ok{background:#dff1e6;color:var(--ok)}.bd.w{background:#fbeccf;color:var(--warn)}.bd.b{background:#f8dcd9;color:var(--bad)}
.hint{color:var(--mute);font-size:12.5px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:8px;z-index:99;display:none;max-width:90vw}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  #app{display:none!important}
  #printArea{display:block!important;direction:rtl;color:#000;font-size:10.5pt}
  .toast{display:none!important}
}
#printArea .ph{text-align:center;line-height:1.7;margin-bottom:6px}
#printArea .ph .co{font-size:14pt;font-weight:700}
#printArea .ph .pj{font-size:11.5pt}
#printArea h2{text-align:center;font-size:13pt;margin:6px 0 8px;border:1.5px solid #000;padding:4px}
#printArea .pm{display:flex;justify-content:space-between;gap:10px;border:1px solid #000;padding:5px 8px;margin-bottom:6px;font-size:10.5pt}
#printArea table{width:100%;border-collapse:collapse;font-size:9.5pt}
#printArea th,#printArea td{border:1px solid #000;padding:2px 4px;text-align:center;height:17px;unicode-bidi:plaintext}
#printArea thead{display:table-header-group}
#printArea tr{page-break-inside:avoid}
#printArea th{background:#e8e8e8}
#printArea .sig{display:flex;justify-content:space-around;margin-top:26px;page-break-inside:avoid;font-size:11pt}
#printArea .sig div{text-align:center;min-width:200px}
#printArea .sig i{display:block;margin-top:34px;border-top:1px solid #000;padding-top:3px;font-style:normal;font-weight:700}
#printArea.ltrp table{direction:ltr}
</style>
</head>

const cur=k=>{const c=S[k];return c.list.find(r=>r.id===c.cur)||c.list[0]};

/* ---------- dates ---------- */
const today=new Date();today.setHours(0,0,0,0);
function pd(s){const m=/^\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\s*$/.exec(String(s||''));return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function badge(s){const d=pd(s);if(!d)return '';const n=Math.round((d-today)/864e5);
 if(n<0)return '<span class="bd b">منتهية</span>';if(n<=60)return '<span class="bd w">قريبة ('+n+' يوم)</span>';return '<span class="bd ok">سارية</span>'}
const num=v=>{const n=parseInt(String(v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n};

/* ---------- navigation ---------- */
const TABS=[['home','🏠 الرئيسية'],['insp','📋 الفحص الدوري'],['sum','📊 تقرير حالة الطفايات'],['aca','🏢 إجمالي ACA'],['set','⚙️ الإعدادات والنسخ الاحتياطي']];

 $('#sub').textContent=S.settings.project}
function render(){nav();const v=$('#view');
 if(tab==='home')v.innerHTML=home();else if(tab==='set')v.innerHTML=settings();else v.innerHTML=editor(tab);
 if(T[tab])applyFilter()}

/* ---------- home ---------- */
function home(){
 const aca=cur('aca').rows,tot=aca.reduce((a,r)=>a+num(r.qty),0);
 const by={};aca.forEach(r=>{const k=r.type+' '+r.wt;by[k]=(by[k]||0)+num(r.qty)});
 const exp=aca.filter(r=>num(r.qty)&&pd(r.d2)&&pd(r.d2)<today).length;
 const i=cur('insp').rows,g=i.filter(r=>r.st==='g').length,m=i.filter(r=>r.st==='m').length,x=i.filter(r=>r.st==='x').length;
 const sm=cur('sum').rows.reduce((a,r)=>a+num(r.qty),0);
 return `<div class="grid">
 <div class="stat" data-tab="insp"><b>${S.insp.list.length}</b><span>نماذج فحص دوري محفوظة</span></div>
 <div class="stat" data-tab="sum"><b>${S.sum.list.length}</b><span>تقارير حالة الطفايات</span></div>
 <div class="stat" data-tab="aca"><b>${tot.toLocaleString('en')}</b><span>إجمالي الأسطوانات في جدول ACA</span></div>
 <div class="stat" data-tab="aca"><b>${exp}</b><span>بنود ACA تاريخ انتهائها قبل اليوم</span></div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin:0 0 8px">ملخص الفحص الدوري المعروض: ${esc(cur('insp').title)}</h3>
 <div class="chips"><span class="chip g">جيدة ${g}</span><span class="chip m">تحتاج صيانة ${m}</span><span class="chip x">غير صالحة ${x}</span><span class="chip">إجمالي الصفوف ${i.length}</span></div></div>
 <div class="card"><h3 style="margin:0 0 8px">أسطوانات ACA حسب النوع والوزن</h3>
 <div class="chips">${Object.entries(by).map(([k,v])=>`<span class="chip">${esc(k)}: <b>${v.toLocaleString('en')}</b></span>`).join('')}</div>
 <div class="hint">مجموع العدد في تقرير الحالة المعروض (المباني 321–325): ${sm.toLocaleString('en')}</div></div>
 <div class="card hint">كل الحقول قابلة للتعديل مباشرة داخل الجداول، ويُحفظ التعديل تلقائياً في هذا المتصفح. من تبويب الإعدادات يمكنك تنزيل نسخة احتياطية (JSON) واسترجاعها على أي جهاز. زر «طباعة» في كل تقرير يطبع النموذج بترويسة الشركة والتوقيعات.</div>`}

/* ---------- editor ---------- */
function editor(k){
 const t=T[k],r=cur(k),L=S[k].list;
 const opts=L.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.title)}</option>`).join('');
 let stats='';
 if(k==='insp'){const g=r.rows.filter(x=>x.st==='g').length,m=r.rows.filter(x=>x.st==='m').length,x2=r.rows.filter(x=>x.st==='x').length;
  stats=`<div class="chips" id="stats"><span class="chip">الصفوف ${r.rows.length}</span><span class="chip g">جيدة ${g}</span><span class="chip m">تحتاج صيانة ${m}</span><span class="chip x">غير صالحة ${x2}</span></div>`}
 else{const tot=r.rows.reduce((a,x)=>a+num(x.qty),0);stats=`<div class="chips" id="stats"><span class="chip">الصفوف ${r.rows.length}</span><span class="chip">مجموع العدد ${tot.toLocaleString('en')}</span></div>`}
 const metaF=(k==='aca'||k==='sum'?[['title',k==='aca'?'Report title':'عنوان النسخة']]:[['title','عنوان النموذج']]).concat(t.meta.map(m=>[m[0],m[1]]));
 const mf=metaF.map(([f,l])=>`<label class="f">${l}<input class="i" type="text" data-rf="${f}" value="${esc(f==='title'?r.title:(r.meta[f]||''))}"></label>`).join('');
 return `<div class="bar">
  <select id="sel">${opts}</select>
  <button class="b" data-act="new">＋ جديد</button><button class="b" data-act="dup">⧉ نسخ</button><button class="b d" data-act="del">🗑 حذف</button>
  <span class="sp"></span>
  <input class="i" id="q" placeholder="بحث داخل الجدول…" value="${esc(q)}">
  <button class="b" data-act="xls">⬇ Excel (CSV)</button><button class="b p" data-act="print">🖨 طباعة</button></div>
 <div class="card"><div class="meta">${mf}</div></div>${stats}
 <div class="tw"><table class="e ${t.ltr?'ltr':''}" id="tbl"><thead><tr>${head(k)}<th></th></tr></thead><tbody>${r.rows.map((x,i)=>row(k,x,i)).join('')}</tbody></table></div>
 <div class="bar" style="margin-top:10px"><button class="b" data-act="addrow">＋ إضافة صف</button>${k==='sum'?'<button class="b" data-act="addsite">＋ إضافة موقع (3 أنواع)</button>':''}<span class="hint">يتم الحفظ تلقائياً أثناء الكتابة.</span></div>`}
function head(k){const t=T[k];let h='';t.cols.forEach(c=>{h+= c[0]==='st'?'<th>جيدة</th><th>تحتاج صيانة</th><th>غير صالحة</th>':`<th>${c[1]}</th>`});
 if(k!=='insp')h+='<th>الصلاحية</th>';return h}
function row(k,x,i){const t=T[k];let h=`<tr data-i="${i}">`;
 t.cols.forEach(c=>{const f=c[0];
  if(f==='st'){['g','m','x'].forEach(s=>h+=`<td class="c"><input type="checkbox" data-st="${s}" ${x.st===s?'checked':''}></td>`)}
  else h+=`<td><input type="text" dir="auto" data-f="${f}" value="${esc(x[f])}" style="min-width:${c[2]||60}px"></td>`});
 if(k!=='insp')h+=`<td class="c" data-bd>${badge(k==='aca'?x.d2:x.d2)}</td>`;
 return h+`<td class="act"><button data-act="ins" title="إدراج صف بعده">＋</button><button data-act="rm" title="حذف الصف">✕</button></td></tr>`}
function applyFilter(){const rows=document.querySelectorAll('#tbl tbody tr');const s=q.trim().toLowerCase();
 rows.forEach(tr=>{tr.hidden=s&&![...tr.querySelectorAll('input[type=text]')].some(i=>i.value.toLowerCase().includes(s))})}
function refreshStats(){const k=tab;const el=$('#stats');if(!el||!T[k])return;const r=cur(k);
 if(k==='insp'){const g=r.rows.filter(x=>x.st==='g').length,m=r.rows.filter(x=>x.st==='m').length,x2=r.rows.filter(x=>x.st==='x').length;
  el.innerHTML=`<span class="chip">الصفوف ${r.rows.length}</span><span class="chip g">جيدة ${g}</span><span class="chip m">تحتاج صيانة ${m}</span><span class="chip x">غير صالحة ${x2}</span>`}
 else el.innerHTML=`<span class="chip">الصفوف ${r.rows.length}</span><span class="chip">مجموع العدد ${r.rows.reduce((a,x)=>a+num(x.qty),0).toLocaleString('en')}</span>`}

 <p class="hint">اترك الاسم فارغاً لإخفاء خانة التوقيع من الطباعة.</p></div>
 <div class="card"><h3 style="margin-top:0">النسخ الاحتياطي</h3>
 <div class="bar"><button class="b p" data-act="exp">⬇ تنزيل نسخة احتياطية (JSON)</button><label class="b" style="cursor:pointer">⬆ استرجاع من ملف<input type="file" id="imp" accept=".json" hidden></label><button class="b d" data-act="reset">↺ استعادة البيانات الأصلية من الملفات المرفوعة</button></div>
 <p class="hint">البيانات محفوظة داخل متصفحك فقط؛ نزّل نسخة احتياطية دورياً أو قبل تغيير الجهاز.</p></div>`}

/* ---------- print ---------- */
function spans(rows,key){const sp=[];let i=0;while(i<rows.length){let j=i+1;while(j<rows.length&&!String(rows[j][key]||'').trim())j++;sp[i]=j-i;for(let z=i+1;z<j;z++)sp[z]=0;i=j}return sp}
function spansEq(rows,key){const sp=[];let i=0;while(i<rows.length){let j=i+1;while(j<rows.length&&rows[j][key]===rows[i][key]&&String(rows[i][key]).trim())j++;sp[i]=j-i;for(let z=i+1;z<j;z++)sp[z]=0;i=j}return sp}
function tableHTML(k,r){const t=T[k];let h='<table><thead>';
 if(k==='insp'){h+=`<tr><th rowspan="2">م</th><th rowspan="2">رقم الطفاية</th><th rowspan="2">النوع</th><th rowspan="2">الوزن</th><th colspan="3">حالة الطفاية</th><th colspan="2">الموقع</th><th rowspan="2">تاريخ التعبئة</th><th rowspan="2">تاريخ الانتهاء</th></tr><tr><th>جيدة</th><th>تحتاج صيانة</th><th>غير صالحة</th><th>الطابق</th><th>رقم أقرب غرفة</th></tr></thead><tbody>`;
  r.rows.forEach(x=>h+=`<tr><td>${esc(x.seq)}</td><td>${esc(x.qty)}</td><td>${esc(x.type)}</td><td>${esc(x.wt)}</td><td>${x.st==='g'?'/':''}</td><td>${x.st==='m'?'/':''}</td><td>${x.st==='x'?'/':''}</td><td>${esc(x.floor)}</td><td>${esc(x.loc)}</td><td>${esc(x.pk)}</td><td>${esc(x.ex)}</td></tr>`)}
 else if(k==='sum'){h+='<tr>'+t.cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  const sp=spans(r.rows,'site');
  r.rows.forEach((x,i)=>{h+='<tr>'+(sp[i]?`<td rowspan="${sp[i]}">${esc(x.sl)}</td><td rowspan="${sp[i]}">${esc(x.site)}</td>`:'')+`<td>${esc(x.type)}</td><td>${esc(x.wt)}</td><td>${esc(x.qty)}</td><td>${esc(x.d1)}</td><td>${esc(x.d2)}</td></tr>`})}
 else{h+='<tr>'+t.cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  const sp=spansEq(r.rows,'b');
  r.rows.forEach((x,i)=>{const under=/renovation/i.test(x.d1)&&!x.d2;
   h+=`<tr><td>${esc(x.sn)}</td>`+(sp[i]?`<td rowspan="${sp[i]}">${esc(x.b)}</td>`:'')+`<td>${esc(x.type)}</td><td>${esc(x.wt)}</td><td>${esc(x.qty)}</td>`+(under?`<td colspan="2">${esc(x.d1)}</td>`:`<td>${esc(x.d1)}</td><td>${esc(x.d2)}</td>`)+'</tr>'})}
 return h+'</tbody></table>'}
function printHTML(k,r){const s=S.settings,m=r.meta;let h=`<div class="ph"><div class="co">${esc(s.company)}</div><div class="pj">${esc(s.project)}</div></div><h2>${esc(T[k].printTitle(r))}</h2>`;
 if(k==='insp')h+=`<div class="pm"><span>اسم المبنى: ${esc(m.building)}</span><span>رقم المبنى: ${esc(m.bno)}</span><span>تاريخ الفحص: ${esc(m.date)}</span></div>`;
 h+=tableHTML(k,r);
 const sg=[[s.s1t,s.s1n]].filter(x=>(x[1]||'').trim());
 if(sg.length)h+='<div class="sig">'+sg.map(([a,b])=>`<div>${esc(a)}<i>${esc(b)}</i></div>`).join('')+'</div>';
 return h}
let DLC=null;try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DLC=d}).catch(()=>{})}catch(e){}
async function dl(name,mime,data){
 if(DLC){try{await DLC.save({filename:name,data});toast('تم حفظ الملف');return true}catch(e){if(e&&e.code==='declined')return false;toast('تعذّر الحفظ من هذه النافذة')}return false}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true}catch(e){toast('تعذّر التنزيل');return false}}
const fname=r=>r.title.replace(/[\\\/:*?"<>|]+/g,' ').trim();
function printDoc(k,r){return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(r.title)+'</title><style>'+document.querySelector('style').textContent+'#printArea{display:block!important}.pbtn{position:fixed;top:10px;left:10px;padding:8px 16px;font:14px Tahoma;cursor:pointer}@media print{.pbtn{display:none}}</style></head><body><button class="pbtn" onclick="print()">🖨 طباعة</button><div id="printArea" class="'+(T[k].ltr?'ltrp':'')+'">'+printHTML(k,r)+'</div><script>setTimeout(function(){try{print()}catch(e){}},400)<\/script></body></html>'}
async function doPrint(){const k=tab,r=cur(k);
 if(DLC){toast('سيُحفظ ملف جاهز للطباعة؛ افتحه واطبعه (Ctrl+P)');await dl(fname(r)+' - للطباعة.html','text/html',printDoc(k,r));return}
 const pa=$('#printArea');pa.className=T[k].ltr?'ltrp':'';pa.innerHTML=printHTML(k,r);
 try{window.print()}catch(e){toast('تعذّرت الطباعة من هذه النافذة')}}
function csvOf(k,r){const t=T[k];const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let h=[];
 t.cols.forEach(c=>{if(c[0]==='st')h.push('جيدة','تحتاج صيانة','غير صالحة');else h.push(c[1])});
 const rows=r.rows.map(x=>{const o=[];t.cols.forEach(c=>{if(c[0]==='st')['g','m','x'].forEach(s=>o.push(x.st===s?'/':''));else o.push(x[c[0]])});return o.map(q).join(',')});
 return '\ufeff'+[h.map(q).join(','),...rows].join('\r\n')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;q='';render();scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=tab,t=T[k];
 if(a==='print')return doPrint();
 if(a==='exp'){dl('fire-reports-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(S,null,1));return}
 if(a==='reset'){if(confirm('سيتم حذف كل التعديلات واسترجاع البيانات الأصلية. متابعة؟')){S=clone(SEED);save();render();toast('تمت استعادة البيانات الأصلية')}return}
 if(!t)return;const r=cur(k);
 if(a==='xls'){dl(fname(r)+'.csv','text/csv;charset=utf-8',csvOf(k,r));return}
 if(a==='new'){const n={id:uid(k[0]),title:'نموذج جديد',meta:{note:''},rows:[]};
  if(k==='insp'){n.meta={building:'',bno:'',date:'',note:''};for(let i=1;i<=30;i++){const x=t.blank();x.seq=String(i);n.rows.push(x)}}else for(let i=0;i<10;i++)n.rows.push(t.blank());
  S[k].list.push(n);S[k].cur=n.id;save();render();return}
 if(a==='dup'){const n=clone(r);n.id=uid(k[0]);n.title=r.title+' (نسخة)';S[k].list.push(n);S[k].cur=n.id;save();render();toast('تم إنشاء نسخة');return}
 if(a==='del'){if(S[k].list.length<2)return toast('لا يمكن حذف آخر نموذج');if(confirm('حذف «'+r.title+'» نهائياً؟')){S[k].list=S[k].list.filter(x=>x.id!==r.id);S[k].cur=S[k].list[0].id;save();render()}return}
 if(a==='addrow'){r.rows.push(t.blank());save();render();const w=$('.tw');w.scrollTop=w.scrollHeight;return}
 if(a==='addsite'){[['POWDER','6 KG'],['CO2','4.5 KG'],['POWDER','50 KG']].forEach(([ty,w],i)=>{const x=t.blank();x.type=ty;x.wt=w;if(!i)x.sl=String(r.rows.filter(z=>z.site).length+1);r.rows.push(x)});save();render();const w=$('.tw');w.scrollTop=w.scrollHeight;return}
 const tr=b.closest('tr');if(!tr)return;const i=+tr.dataset.i;
 if(a==='rm'){r.rows.splice(i,1);save();render()}
 if(a==='ins'){r.rows.splice(i+1,0,t.blank());save();render()}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){q=el.value;applyFilter();return}
 if(el.dataset.set){S.settings[el.dataset.set]=el.value;save();$('#sub').textContent=S.settings.project;return}
 if(!T[tab])return;const r=cur(tab);
 if(el.dataset.rf){const f=el.dataset.rf;if(f==='title'){r.title=el.value;const o=$('#sel option:checked');if(o)o.textContent=el.value}else r.meta[f]=el.value;save();return}
 const tr=el.closest('tr');if(tr&&el.dataset.f){const i=+tr.dataset.i;r.rows[i][el.dataset.f]=el.value;
  if(el.dataset.f==='d2'){const c=tr.querySelector('[data-bd]');if(c)c.innerHTML=badge(el.value)}
  if(el.dataset.f==='qty')refreshStats();save()}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='sel'){S[tab].cur=el.value;q='';save();render();return}
 if(el.id==='imp'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.insp||!d.sum||!d.aca)throw 0;S=d;save();render();toast('تم الاسترجاع')}catch(x){toast('ملف غير صالح')}};rd.readAsText(f);return}
 if(el.dataset.st){const tr=el.closest('tr'),r=cur(tab),i=+tr.dataset.i;r.rows[i].st=el.checked?el.dataset.st:'';
  tr.querySelectorAll('[data-st]').forEach(c=>c.checked=(c.dataset.st===r.rows[i].st));refreshStats();save()}});
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
